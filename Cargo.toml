[package]
name = "golde-marketing-api"
version = "1.0.0"
edition = "2021"
authors = ["GOLD-e Technologies <eng@golde-ai.com>"]
description = "GOLD-e GrowthOS Marketing API in Rust with Axum, SQLx, JWT rotation, Multi-tenant Isolation, and WhatsApp Cloud API"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.18", features = ["derive"] }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "json"] }

bcrypt = "0.15"
jsonwebtoken = "9.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.32", features = ["tokio-rustls-comp", "connection-manager"] }

dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
async-trait = "0.1"
anyhow = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
csv = "1.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
hyper = "1.3"
