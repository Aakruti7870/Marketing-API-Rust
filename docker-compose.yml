version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: golde-rust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: golde
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketing_api
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U golde -d marketing_api']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golde-rust-marketing-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://golde:password@postgres:5432/marketing_api?sslmode=disable
      JWT_ACCESS_SECRET: your-super-secret-access-key-minimum-32-characters-change-in-prod
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-minimum-32-characters-change-in-prod
      WHATSAPP_SIMULATION_MODE: 'true'
      RUST_LOG: info,golde_marketing_api=debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
