name: Activate EC2 Now

on:
  push:
    branches: [main]

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload installer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "deploy/install-ec2.sh"
          target: "/tmp/golde-marketing-api-release/"
      - name: Activate service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            chmod +x /tmp/golde-marketing-api-release/deploy/install-ec2.sh
            /tmp/golde-marketing-api-release/deploy/install-ec2.sh
