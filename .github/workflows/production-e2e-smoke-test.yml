name: Production E2E Smoke Test

on:
  workflow_run:
    workflows: ["Deploy to AWS EC2 Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://api.goldetech.com
      SMOKE_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

    steps:
      - name: Validate smoke-test credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_SECRET}" ]]; then
            echo "::error::Missing WEBHOOK_SECRET repository secret."
            exit 1
          fi
          if [[ -z "${SMOKE_EMAIL}" || -z "${SMOKE_PASSWORD}" ]]; then
            echo "::error::Missing SMOKE_TEST_EMAIL or SMOKE_TEST_PASSWORD repository secrets."
            echo "Create a dedicated production smoke-test account and store its credentials as GitHub Actions secrets."
            exit 1
          fi

      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "${BASE_URL}/health" | tee health.json
          jq -e '.status == "healthy" and .service == "GOLD-e GrowthOS Marketing API"' health.json >/dev/null
          COMMIT_SHA="$(jq -r '.commit_sha // "unknown"' health.json)"
          echo "Production deployed backend commit SHA: ${COMMIT_SHA}"

      - name: Login
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg email "${SMOKE_EMAIL}" --arg password "${SMOKE_PASSWORD}" \
              '{email:$email,password:$password}')" \
            "${BASE_URL}/api/v1/auth/login" > login.json

          jq -e '.success == true and (.data.tokens.access_token | type == "string") and (.data.workspace_id | type == "string")' login.json >/dev/null
          ACCESS_TOKEN="$(jq -r '.data.tokens.access_token' login.json)"
          WORKSPACE_ID="$(jq -r '.data.workspace_id' login.json)"
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "ACCESS_TOKEN=${ACCESS_TOKEN}" >> "${GITHUB_ENV}"
          echo "WORKSPACE_ID=${WORKSPACE_ID}" >> "${GITHUB_ENV}"

      - name: Verify authenticated workspace
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/workspaces/current" > workspace.json
          jq -e '.success == true and (.data.id | type == "string")' workspace.json >/dev/null

      - name: Verify AI Provider Catalog & Secrets Exclusion
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/playground/providers" > providers.json

          jq -e '.success == true and (.data | type == "array") and (.data | length) >= 2' providers.json >/dev/null
          jq -e '.data[] | select(.id == "openai") | .configured == true' providers.json >/dev/null

          # Verify Anthropic Claude model catalog is current and does not advertise retired models
          jq -e '.data[] | select(.id == "anthropic") | .default_model == "claude-sonnet-5-5"' providers.json >/dev/null
          jq -e '.data[] | select(.id == "anthropic") | (.models | index("claude-sonnet-5-5")) != null' providers.json >/dev/null
          jq -e '.data[] | select(.id == "anthropic") | (.models | index("claude-haiku-4-5-20251001")) != null' providers.json >/dev/null
          jq -e '.data[] | select(.id == "anthropic") | (.models | index("claude-opus-4-8")) != null' providers.json >/dev/null
          if grep -qiE 'claude-3-5-sonnet-20241022|claude-3-opus-20240229' providers.json; then
            echo "::error::Retired Anthropic Claude model IDs found in provider catalog!"
            exit 1
          fi

          # Strict security: Verify no backend secrets or API keys are leaked in response
          if grep -qiE 'ai_api_key|anthropic_api_key|jwt_secret|password' providers.json; then
            echo "::error::Sensitive credential pattern detected in public providers response!"
            exit 1
          fi
          echo "AI Provider Catalog verified: active provider detected and secrets protected:"
          cat providers.json

      - name: Execute Live Production AI Generation and Verify Persistence
        shell: bash
        run: |
          set -euo pipefail
          MODELS=($(jq -r '.data[] | select(.id == "openai") | .models[]' providers.json))
          echo "Available models for OpenAI provider: ${MODELS[*]}"
          HTTP_CODE=""
          for attempt in $(seq 0 4); do
            MODEL_INDEX=$((attempt % ${#MODELS[@]}))
            CURRENT_MODEL="${MODELS[$MODEL_INDEX]}"
            echo "Attempt $((attempt + 1)): generating AI content with model ${CURRENT_MODEL}..."
            HTTP_CODE="$(curl -s -o ai-generate.json -w "%{http_code}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "x-workspace-id: ${WORKSPACE_ID}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "${CURRENT_MODEL}" '{"kind":"WHATSAPP_TEMPLATE","prompt":"Special festive offer for valued customers","provider":"openai","model":$m}')" \
              "${BASE_URL}/api/v1/playground/generate")"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            echo "Attempt $((attempt + 1)) returned HTTP ${HTTP_CODE}:"
            cat ai-generate.json || true
            BACKOFF=$(((attempt + 1) * 10))
            echo "Backing off for ${BACKOFF}s before attempt $((attempt + 2))..."
            sleep "$BACKOFF"
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::AI Generation failed with HTTP ${HTTP_CODE}"
            cat ai-generate.json
            exit 1
          fi

          jq -e '.success == true and (.data.id | type == "string") and (.data.content | type == "string") and (.data.content | length) > 0' ai-generate.json >/dev/null
          jq -e '.data.provider == "openai"' ai-generate.json >/dev/null

          ASSET_ID="$(jq -r '.data.id' ai-generate.json)"
          echo "Generated asset ID: ${ASSET_ID}"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/playground/assets" > assets.json

          jq -e --arg id "${ASSET_ID}" '.data[] | select(.id == $id)' assets.json >/dev/null
          echo "AI generation successfully executed and verified persisted in PostgreSQL."

      - name: Verify AI Safeguards and Fail-Closed Error Handling
        shell: bash
        run: |
          set -euo pipefail
          # 1. Unconfigured Ollama must fail closed with 400 Bad Request
          HTTP_CODE="$(curl -s -o /tmp/ollama-res.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -d '{"kind":"WHATSAPP_TEMPLATE","prompt":"Test unconfigured","provider":"ollama"}' \
            "${BASE_URL}/api/v1/playground/generate" || true)"

          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "::error::Unconfigured Ollama unexpectedly succeeded or simulated response!"
            exit 1
          fi
          echo "Ollama fail-closed check PASSED (HTTP ${HTTP_CODE})."

          # 2. Oversized prompt safeguard must fail closed with 400 Validation error
          OVERSIZED_PROMPT="$(python3 -c 'print("X" * 65000)')"
          HTTP_CODE_SAFEGUARD="$(curl -s -o /tmp/safeguard-res.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg p "${OVERSIZED_PROMPT}" '{"kind":"WHATSAPP_TEMPLATE","prompt":$p,"provider":"openai"}')" \
            "${BASE_URL}/api/v1/playground/generate" || true)"

          # Accept 422 (UNPROCESSABLE_ENTITY from AppError::Validation) or 400
          if [[ "${HTTP_CODE_SAFEGUARD}" != "422" && "${HTTP_CODE_SAFEGUARD}" != "400" ]]; then
            echo "::error::Expected 422 or 400 validation error, got HTTP ${HTTP_CODE_SAFEGUARD}"
            cat /tmp/safeguard-res.json
            exit 1
          fi
          grep -q "exceeds maximum allowed safeguard" /tmp/safeguard-res.json
          echo "Prompt length safeguard PASSED (HTTP ${HTTP_CODE_SAFEGUARD} rejection)."

          # 3. Fail-closed safeguard: if Anthropic is unconfigured, reject requests rather than simulating success
          ANTHROPIC_CONFIGURED="$(jq -r '.data[] | select(.id == "anthropic") | .configured' providers.json)"
          if [[ "${ANTHROPIC_CONFIGURED}" == "false" ]]; then
            HTTP_CODE_CLAUDE="$(curl -s -o /tmp/claude-res.json -w "%{http_code}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "x-workspace-id: ${WORKSPACE_ID}" \
              -H "Content-Type: application/json" \
              -d '{"kind":"WHATSAPP_TEMPLATE","prompt":"Test unconfigured Claude","provider":"anthropic"}' \
              "${BASE_URL}/api/v1/playground/generate" || true)"
            if [[ "${HTTP_CODE_CLAUDE}" == "200" ]]; then
              echo "::error::Unconfigured Anthropic Claude unexpectedly succeeded with HTTP 200 simulation!"
              exit 1
            fi
            echo "Anthropic fail-closed check PASSED (HTTP ${HTTP_CODE_CLAUDE})."
          else
            echo "Anthropic Claude configured on backend."
          fi

      - name: Verify Core Modules Live Endpoints & Tenant Isolation
        shell: bash
        run: |
          set -euo pipefail
          # Verify Campaigns endpoint responds with 200 OK
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/campaigns" > /dev/null

          # Verify AI Agents endpoint responds with 200 OK
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/agents" > /dev/null

          # Verify Messages endpoint responds with 200 OK
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/messages" > /dev/null

          # Verify Tenant isolation: mismatched workspace rejected
          FAKE_WORKSPACE_ID="00000000-0000-0000-0000-000000000001"
          HTTP_ISOLATION="$(curl -s -o /tmp/isolation-res.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${FAKE_WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/playground/assets" || true)"

          if [[ "${HTTP_ISOLATION}" == "200" ]]; then
            echo "::error::Unauthorized workspace access succeeded!"
            exit 1
          fi
          echo "Core modules and tenant isolation PASSED."


      - name: Clean previous E2E test automations
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations" > existing-automations.json
          jq -r '.data[] | select(.name | startswith("PROD E2E ")) | .id' existing-automations.json | while read -r id; do
            [ -z "$id" ] && continue
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "x-workspace-id: ${WORKSPACE_ID}" \
              "${BASE_URL}/api/v1/automations/${id}" >/dev/null
          done
          echo "Old PROD E2E test automations cleaned."

      - name: Create and run manual automation
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg name "PROD E2E Manual ${GITHUB_RUN_ID}" \
            '{
              name:$name,
              description:"Automated production E2E smoke test",
              triggers:[{trigger_type:"MANUAL_TRIGGER",config:{},enabled:true}],
              nodes:[
                {node_key:"trigger",node_type:"MANUAL_TRIGGER",name:"Manual Trigger",config:{},position:{}},
                {node_key:"set",node_type:"SET",name:"Set Smoke Value",config:{values:{smoke_test:"passed"}},position:{}}
              ],
              edges:[{source_node_key:"trigger",target_node_key:"set",config:{}}],
              schedule:null
            }' > automation.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            --data @automation.json \
            "${BASE_URL}/api/v1/automations" > automation-create.json

          AUTOMATION_ID="$(jq -r '.data.id' automation-create.json)"
          test "${AUTOMATION_ID}" != "null"
          echo "AUTOMATION_ID=${AUTOMATION_ID}" >> "${GITHUB_ENV}"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/${AUTOMATION_ID}/publish" > publish.json
          jq -e '.success == true and .data.status == "PUBLISHED"' publish.json >/dev/null

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -d '{"payload":{"source":"github-smoke-test","expected":"pass"}}' \
            "${BASE_URL}/api/v1/automations/${AUTOMATION_ID}/run" > run.json

          RUN_ID="$(jq -r '.data.run_id' run.json)"
          test "${RUN_ID}" != "null"
          echo "RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"

          sleep 2
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/runs/${RUN_ID}" > run-status.json

          jq -e '.success == true and .data.status == "COMPLETED" and (.data.steps | length) == 2' run-status.json >/dev/null

      - name: Test webhook trigger
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg name "PROD E2E Webhook ${GITHUB_RUN_ID}" \
            --arg webhook_secret "${WEBHOOK_SECRET}" \
            '{
              name:$name,
              description:"Automated production webhook smoke test",
              triggers:[{trigger_type:"WEBHOOK_TRIGGER",config:{secret:$webhook_secret},enabled:true}],
              nodes:[
                {node_key:"trigger",node_type:"WEBHOOK_TRIGGER",name:"Webhook Trigger",config:{},position:{}},
                {node_key:"set",node_type:"SET",name:"Set Webhook Value",config:{values:{webhook_test:"passed"}},position:{}}
              ],
              edges:[{source_node_key:"trigger",target_node_key:"set",config:{}}],
              schedule:null
            }' > webhook-automation.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            --data @webhook-automation.json \
            "${BASE_URL}/api/v1/automations" > webhook-create.json

          WEBHOOK_AUTOMATION_ID="$(jq -r '.data.id' webhook-create.json)"
          test "${WEBHOOK_AUTOMATION_ID}" != "null"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/${WEBHOOK_AUTOMATION_ID}/publish" > webhook-publish.json
          jq -e '.success == true and .data.status == "PUBLISHED"' webhook-publish.json >/dev/null

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-automation-secret: ${WEBHOOK_SECRET}" \
            -d '{"source":"github-smoke-test","webhook_test":"pass"}' \
            "${BASE_URL}/api/v1/automation-webhooks/${WEBHOOK_AUTOMATION_ID}" > webhook-run.json

          WEBHOOK_RUN_ID="$(jq -r '.run_id' webhook-run.json)"
          test "${WEBHOOK_RUN_ID}" != "null"

          sleep 2
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/runs/${WEBHOOK_RUN_ID}" > webhook-status.json

          jq -e '.success == true and .data.status == "COMPLETED" and (.data.steps | length) == 2' webhook-status.json >/dev/null

      - name: Test approval pause and resume
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg name "PROD E2E Approval ${GITHUB_RUN_ID}" \
            '{
              name:$name,
              description:"Automated production approval smoke test",
              triggers:[{trigger_type:"MANUAL_TRIGGER",config:{},enabled:true}],
              nodes:[
                {node_key:"trigger",node_type:"MANUAL_TRIGGER",name:"Manual Trigger",config:{},position:{}},
                {node_key:"approval",node_type:"APPROVAL",name:"Approval Gate",config:{},position:{}},
                {node_key:"success",node_type:"SET",name:"Success Path",config:{values:{approval_test:"approved"}},position:{}},
                {node_key:"declined",node_type:"SET",name:"Declined Path",config:{values:{approval_test:"declined"}},position:{}}
              ],
              edges:[
                {source_node_key:"trigger",target_node_key:"approval",config:{}},
                {source_node_key:"approval",target_node_key:"success",config:{path:"approval.outcome",operator:"eq",value:"approved"}},
                {source_node_key:"approval",target_node_key:"declined",config:{path:"approval.outcome",operator:"eq",value:"declined"}}
              ],
              schedule:null
            }' > approval-automation.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            --data @approval-automation.json \
            "${BASE_URL}/api/v1/automations" > approval-create.json

          APPROVAL_AUTOMATION_ID="$(jq -r '.data.id' approval-create.json)"
          test "${APPROVAL_AUTOMATION_ID}" != "null"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/${APPROVAL_AUTOMATION_ID}/publish" > approval-publish.json
          jq -e '.success == true and .data.status == "PUBLISHED"' approval-publish.json >/dev/null

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -d '{"payload":{"source":"github-smoke-test"}}' \
            "${BASE_URL}/api/v1/automations/${APPROVAL_AUTOMATION_ID}/run" > approval-run.json

          APPROVAL_RUN_ID="$(jq -r '.data.run_id' approval-run.json)"
          test "${APPROVAL_RUN_ID}" != "null"

          sleep 1
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/runs/${APPROVAL_RUN_ID}" > approval-status.json

          jq -e '.success == true and .data.status == "WAITING_APPROVAL"' approval-status.json >/dev/null

          STEP_ID="$(jq -r '.data.steps[] | select(.node_type == "APPROVAL") | .id' approval-status.json)"
          test -n "${STEP_ID}" && test "${STEP_ID}" != "null"

          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "x-workspace-id: ${WORKSPACE_ID}" "${BASE_URL}/api/v1/automations/runs/${APPROVAL_RUN_ID}/steps/${STEP_ID}/approve" > approval-result.json

          jq -e '.success == true and .data.approved == true' approval-result.json >/dev/null

          sleep 1
          curl --fail --silent --show-error -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "x-workspace-id: ${WORKSPACE_ID}" "${BASE_URL}/api/v1/automations/runs/${APPROVAL_RUN_ID}" > approval-completed.json

          jq -e '.success == true and .data.status == "COMPLETED" and (.data.steps | length) == 3' approval-completed.json >/dev/null
          jq -e '.data.steps[] | select(.node_key == "success") | .output.approval_test == "approved"' approval-completed.json >/dev/null
          jq -e '.data.steps[] | select(.node_type == "APPROVAL") | .output.approved == true and .output.outcome == "approved"' approval-completed.json >/dev/null

          # Run the same production workflow a second time and verify the Declined path.
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -d '{"payload":{"source":"github-smoke-test","approval_outcome":"declined"}}' \
            "${BASE_URL}/api/v1/automations/${APPROVAL_AUTOMATION_ID}/run" > approval-decline-run.json

          APPROVAL_DECLINE_RUN_ID="$(jq -r '.data.run_id' approval-decline-run.json)"
          test "${APPROVAL_DECLINE_RUN_ID}" != "null"

          sleep 1
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/runs/${APPROVAL_DECLINE_RUN_ID}" > approval-decline-status.json

          DECLINE_STEP_ID="$(jq -r '.data.steps[] | select(.node_type == "APPROVAL") | .id' approval-decline-status.json)"
          test -n "${DECLINE_STEP_ID}" && test "${DECLINE_STEP_ID}" != "null"
          jq -e '.success == true and .data.status == "WAITING_APPROVAL"' approval-decline-status.json >/dev/null

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/runs/${APPROVAL_DECLINE_RUN_ID}/steps/${DECLINE_STEP_ID}/decline" > approval-decline-result.json

          jq -e '.success == true and .data.approved == false and .data.outcome == "declined"' approval-decline-result.json >/dev/null

          sleep 1
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-workspace-id: ${WORKSPACE_ID}" \
            "${BASE_URL}/api/v1/automations/runs/${APPROVAL_DECLINE_RUN_ID}" > approval-declined-completed.json

          jq -e '.success == true and .data.status == "COMPLETED" and (.data.steps | length) == 3' approval-declined-completed.json >/dev/null
          jq -e '.data.steps[] | select(.node_key == "declined") | .output.approval_test == "declined"' approval-declined-completed.json >/dev/null
          jq -e '.data.steps[] | select(.node_type == "APPROVAL") | .output.approved == false and .output.outcome == "declined"' approval-declined-completed.json >/dev/null
          echo "Production automation E2E smoke test PASSED: success and declined approval paths verified."

      - name: Execute Real Browser Acceptance Suite on https://kryso.dev
        shell: bash
        env:
          TARGET_URL: https://kryso.dev
          SMOKE_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Setting up headless browser test dependencies..."
          mkdir -p /tmp/browser-test
          npm install --prefix /tmp/browser-test puppeteer --no-audit --no-fund
          NODE_PATH=/tmp/browser-test/node_modules node scripts/browser-acceptance-suite.js

      - name: Remove temporary E2E automations
        if: always()
        shell: bash
        run: |
          set +e
          for id in "${AUTOMATION_ID:-}" "${WEBHOOK_AUTOMATION_ID:-}" "${APPROVAL_AUTOMATION_ID:-}"; do
            [ -z "$id" ] || [ "$id" = "null" ] && continue
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "x-workspace-id: ${WORKSPACE_ID}" \
              "${BASE_URL}/api/v1/automations/${id}" >/dev/null || true
          done
          echo "Temporary PROD E2E automations removed."
