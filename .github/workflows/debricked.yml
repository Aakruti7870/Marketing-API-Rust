# Debricked dependency / vulnerability scan.
# Enable explicitly by setting the repository Actions variable:
#   DEBRICKED_ENABLED=true
# and provide the DEBRICKED_TOKEN secret.
# This keeps CI deterministic when Debricked is not configured.

name: Debricked Scan

on:
  push:

permissions:
  contents: read

jobs:
  vulnerabilities-scan:
    name: Vulnerabilities scan
    if: ${{ vars.DEBRICKED_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: debricked/actions@v4
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
