name: Activate EC2 Production

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Activate production service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail
            curl -fsSL "https://raw.githubusercontent.com/Aakruti7870/Marketing-API-Rust/main/deploy/install-ec2.sh" -o /tmp/install-ec2.sh
            test -s /tmp/install-ec2.sh
            chmod +x /tmp/install-ec2.sh
            /tmp/install-ec2.sh
