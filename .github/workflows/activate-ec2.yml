name: Activate EC2 Production

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Activate production service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail
            INSTALL_URL="https://raw.githubusercontent.com/Aakruti7870/Marketing-API-Rust/main/deploy/install-ec2.sh?cachebust=$(date +%s)"
            curl -fsSL "$INSTALL_URL" -o /tmp/install-ec2.sh
            test -s /tmp/install-ec2.sh
            grep -Fq '/etc/letsencrypt/live/api.goldetech.com/fullchain.pem' /tmp/install-ec2.sh
            grep -Fq '/etc/letsencrypt/live/api.goldetech.com/privkey.pem' /tmp/install-ec2.sh
            if grep -Fq 'api.goldetech.com-api' /tmp/install-ec2.sh; then
              echo "ERROR: stale api.goldetech.com-api certificate path detected in installer" >&2
              exit 1
            fi
            chmod +x /tmp/install-ec2.sh
            /tmp/install-ec2.sh
