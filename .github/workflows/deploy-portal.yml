name: Deploy GOLD-e GrowthOS Portal

on:
  push:
    branches:
      - main
      - ui/golde-growthos-portal
  workflow_dispatch:

jobs:
  deploy-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GOLD-e GrowthOS project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build GOLD-e GrowthOS Portal
        working-directory: frontend
        run: npm run build

      - name: Upload new portal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/tmp/golde-portal-release/"

      - name: Activate new portal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/golde-portal
            sudo rm -rf /opt/golde-portal/*

            sudo cp -r /tmp/golde-portal-release/frontend/dist/. /opt/golde-portal/

            sudo chown -R www-data:www-data /opt/golde-portal

            sudo nginx -t
            sudo systemctl reload nginx

            curl -fsS -H 'Host: goldetech.com' \
              http://127.0.0.1/ >/dev/null

            echo "GOLD_E_GROWTHOS_PORTAL_DEPLOY_OK"
