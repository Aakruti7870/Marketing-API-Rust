name: Deploy GOLD-e GrowthOS Portal

on:
  workflow_dispatch:

jobs:
  deploy-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GOLD-e GrowthOS project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build GOLD-e GrowthOS Portal
        working-directory: frontend
        run: npm run build

      - name: Upload new portal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/tmp/golde-portal-release/"

      - name: Activate new portal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            sudo mkdir -p /opt/golde-portal
            sudo rm -rf /opt/golde-portal/*
            sudo cp -r /tmp/golde-portal-release/frontend/dist/. /opt/golde-portal/
            sudo chown -R www-data:www-data /opt/golde-portal

            # The EC2 Nginx configuration already proves this is the active
            # certificate for the public website. Reuse it directly.
            CERT_DIR="/etc/letsencrypt/live/goldetech.com"

            if [ ! -s "$CERT_DIR/fullchain.pem" ] || [ ! -s "$CERT_DIR/privkey.pem" ]; then
              echo "Expected public-site TLS certificate files are missing: $CERT_DIR" >&2
              sudo ls -la /etc/letsencrypt/live/ || true
              sudo nginx -T 2>&1 | grep -n -E 'server_name|ssl_certificate|root' || true
              exit 1
            fi

            PORTAL_NGINX="/etc/nginx/sites-available/golde-portal"
            sudo tee "$PORTAL_NGINX" >/dev/null <<NGINX
            server {
              listen 80;
              listen [::]:80;
              server_name goldetech.com www.goldetech.com;
              return 301 https://goldetech.com\$request_uri;
            }

            server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name goldetech.com www.goldetech.com;

              root /opt/golde-portal;
              index index.html;

              ssl_certificate $CERT_DIR/fullchain.pem;
              ssl_certificate_key $CERT_DIR/privkey.pem;

              location / {
                try_files \$uri \$uri/ /index.html;
              }

              location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
                expires -1;
                try_files \$uri =404;
              }

              location = /sw.js {
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                expires -1;
                try_files \$uri =404;
              }
            }
            NGINX

            # Remove enabled vhosts for the public website domains only.
            # api.goldetech.com is not touched.
            for enabled in /etc/nginx/sites-enabled/*; do
              [ -e "$enabled" ] || continue
              if sudo grep -Eo 'server_name[^;]*;' "$enabled" 2>/dev/null | grep -Eq '(^|[[:space:]])(goldetech\.com|www\.goldetech\.com)([[:space:];]|$)'; then
                if [ "$enabled" != "/etc/nginx/sites-enabled/golde-portal" ]; then
                  sudo rm -f "$enabled"
                fi
              fi
            done

            sudo ln -sfn "$PORTAL_NGINX" /etc/nginx/sites-enabled/golde-portal

            test -s /opt/golde-portal/index.html
            grep -q 'GOLD-e' /opt/golde-portal/index.html

            sudo nginx -t
            sudo systemctl reload nginx

            curl -fsS --resolve goldetech.com:443:127.0.0.1 https://goldetech.com/ | grep -q 'GOLD-e'
            curl -fsS https://goldetech.com/ | grep -q 'GOLD-e'

            echo "GOLD_E_GROWTHOS_PORTAL_DEPLOY_OK"
