name: Deploy GOLD-e GrowthOS Portal

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GOLD-e GrowthOS project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build GOLD-e GrowthOS Portal
        working-directory: frontend
        run: npm run build

      - name: Package portal release
        run: tar -czf /tmp/golde-portal-release.tar.gz -C frontend/dist .

      - name: Diagnose GitHub OIDC identity (claims only)
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          TOKEN="$(jq -r '.value' <<< "$TOKEN_JSON")"
          CLAIMS="$(TOKEN="$TOKEN" python3 -c 'import os,base64,json; p=os.environ["TOKEN"].split(".")[1]; p += "="*((4-len(p)%4)%4); d=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:d.get(k) for k in ["iss","aud","sub","repository","ref","job_workflow_ref"]}))')"
          echo "$CLAIMS"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::352285845269:role/golde-growthos-portal-deploy
          aws-region: ap-south-1

      - name: Upload portal artifact to private S3
        env:
          RELEASE_BUCKET: golde-growthos-portal-deploy-352285845269-ap-south-1
        run: aws s3 cp /tmp/golde-portal-release.tar.gz "s3://${RELEASE_BUCKET}/releases/${GITHUB_SHA}.tar.gz" --sse AES256

      - name: Deploy through AWS Systems Manager (no inbound SSH required)
        env:
          RELEASE_BUCKET: golde-growthos-portal-deploy-352285845269-ap-south-1
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/activate-portal.sh <<'SCRIPT'
          set -euo pipefail
          REGION="ap-south-1"
          BUCKET="golde-growthos-portal-deploy-352285845269-ap-south-1"
          if ! command -v aws >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y awscli
          fi
          command -v aws >/dev/null 2>&1 || { echo "AWS CLI installation failed" >&2; exit 1; }
          KEY="releases/__GITHUB_SHA__.tar.gz"
          RELEASE="/tmp/golde-portal-release-__GITHUB_SHA__"
          ARCHIVE="/tmp/golde-portal-__GITHUB_SHA__.tar.gz"
          BACKUP="/opt/golde-portal.previous"

          aws s3 cp "s3://${BUCKET}/${KEY}" "${ARCHIVE}" --region "${REGION}"
          sudo mkdir -p "${RELEASE}"
          sudo tar -xzf "${ARCHIVE}" -C "${RELEASE}"
          sudo test -s "${RELEASE}/index.html"
          sudo grep -q 'GOLD-e' "${RELEASE}/index.html"

          CERT_DIR="/etc/letsencrypt/live/goldetech.com"
          if ! sudo test -s "${CERT_DIR}/fullchain.pem" || ! sudo test -s "${CERT_DIR}/privkey.pem"; then
            echo "Expected public-site TLS certificate files are missing: ${CERT_DIR}" >&2
            exit 1
          fi

          PORTAL_NGINX="/etc/nginx/sites-available/golde-portal"
          sudo tee "${PORTAL_NGINX}" >/dev/null <<NGINX
          server {
            listen 80;
            listen [::]:80;
            server_name goldetech.com www.goldetech.com;
            return 301 https://goldetech.com\$request_uri;
          }
          server {
            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name goldetech.com www.goldetech.com;
            root /opt/golde-portal;
            index index.html;
            ssl_certificate ${CERT_DIR}/fullchain.pem;
            ssl_certificate_key ${CERT_DIR}/privkey.pem;
            location / { try_files \$uri \$uri/ /index.html; }
            location = /index.html {
              add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
              expires -1;
              try_files \$uri =404;
            }
            location = /sw.js {
              add_header Cache-Control "no-store, no-cache, must-revalidate" always;
              expires -1;
              try_files \$uri =404;
            }
          }
          NGINX

          for enabled in /etc/nginx/sites-enabled/*; do
            [ -e "${enabled}" ] || continue
            if sudo grep -Eo 'server_name[^;]*;' "${enabled}" 2>/dev/null | grep -Eq '(^|[[:space:]])(goldetech\.com|www\.goldetech\.com)([[:space:];]|$)'; then
              if [ "${enabled}" != "/etc/nginx/sites-enabled/golde-portal" ]; then
                sudo rm -f "${enabled}"
              fi
            fi
          done
          sudo ln -sfn "${PORTAL_NGINX}" /etc/nginx/sites-enabled/golde-portal

          sudo nginx -t
          sudo chown -R www-data:www-data "${RELEASE}"
          if sudo test -d /opt/golde-portal; then
            sudo rm -rf "${BACKUP}"
            sudo mv /opt/golde-portal "${BACKUP}"
          fi
          sudo mv "${RELEASE}" /opt/golde-portal
          if ! sudo nginx -t || ! sudo systemctl reload nginx; then
            sudo rm -rf /opt/golde-portal
            if sudo test -d "${BACKUP}"; then sudo mv "${BACKUP}" /opt/golde-portal; fi
            sudo nginx -t && sudo systemctl reload nginx || true
            exit 1
          fi
          curl -fsS --resolve goldetech.com:443:127.0.0.1 https://goldetech.com/ | grep -q 'GOLD-e'
          curl -fsS https://goldetech.com/ | grep -q 'GOLD-e'
          echo "GOLD_E_GROWTHOS_PORTAL_DEPLOY_OK"
          SCRIPT

          # Expand the commit SHA in the remote script before sending it to SSM.
          sed -i "s/__GITHUB_SHA__/${GITHUB_SHA}/g" /tmp/activate-portal.sh
          jq -n --arg script "$(cat /tmp/activate-portal.sh)" '{
            DocumentName: "AWS-RunShellScript",
            InstanceIds: ["i-02f31c0724d24bac8"],
            Comment: "Deploy GOLD-e GrowthOS portal from GitHub Actions",
            Parameters: {commands: [$script]}
          }' > /tmp/ssm-command.json

          COMMAND_ID="$(aws ssm send-command --cli-input-json file:///tmp/ssm-command.json --query 'Command.CommandId' --output text)"
          echo "SSM command: ${COMMAND_ID}"
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id i-02f31c0724d24bac8 --query 'Status' --output text 2>/dev/null || true)"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id i-02f31c0724d24bac8 --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id i-02f31c0724d24bac8 --query '[Status,StandardOutputContent,StandardErrorContent]' --output json || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM deployment command ${COMMAND_ID}" >&2
          exit 1
