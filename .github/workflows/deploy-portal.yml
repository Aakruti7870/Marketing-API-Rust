name: Deploy GOLD-e Portal to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Fetch portal
        run: git clone --depth 1 https://github.com/Aakruti7870/MarketingAPI.git portal

      - name: Build portal
        working-directory: portal/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload portal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "portal/frontend/build"
          target: "/tmp/golde-portal-release/"

      - name: Activate portal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/golde-portal
            sudo rm -rf /opt/golde-portal/*
            sudo cp -r /tmp/golde-portal-release/portal/frontend/build/. /opt/golde-portal/
            sudo chown -R www-data:www-data /opt/golde-portal
            sudo tee /etc/nginx/sites-available/golde-portal >/dev/null <<'EOF'
            server {
                listen 80;
                server_name goldetech.com www.goldetech.com;
                root /opt/golde-portal;
                index index.html;

                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;

                location /api/ {
                    proxy_pass http://127.0.0.1:4000/api/v1/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 60s;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF
            sudo ln -sfn /etc/nginx/sites-available/golde-portal /etc/nginx/sites-enabled/golde-portal
            sudo nginx -t
            sudo systemctl reload nginx
            if getent hosts goldetech.com >/dev/null 2>&1; then
              sudo certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d goldetech.com -d www.goldetech.com || true
            fi
            curl -fsS -H 'Host: goldetech.com' http://127.0.0.1/ >/dev/null
            echo "PORTAL_DEPLOY_OK"
