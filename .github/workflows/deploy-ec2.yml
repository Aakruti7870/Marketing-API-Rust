name: Deploy to AWS EC2 Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm deployment to production after verification"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    if: inputs.confirm_production == true
    environment: production
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: golde
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketing_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golde -d marketing_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://golde:password@localhost:5432/marketing_api?sslmode=disable
      JWT_ACCESS_SECRET: deployment_build_access_secret_at_least_32_chars
      JWT_REFRESH_SECRET: deployment_build_refresh_secret_at_least_32_chars

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Prepare database schema
        run: sqlx migrate run --source ./migrations

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features -- --nocapture

      - name: Build
        run: cargo build --release --bin golde-marketing-api

      - name: Prepare release staging directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            rm -rf /tmp/golde-marketing-api-release
            mkdir -p /tmp/golde-marketing-api-release

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "target/release/golde-marketing-api,migrations"
          target: "/tmp/golde-marketing-api-release/"

      - name: Activate release and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=/opt/golde-marketing-api
            RELEASE_DIR=/tmp/golde-marketing-api-release
            BACKUP_DIR="$APP_DIR/backups"
            TS=$(date -u +%Y%m%dT%H%M%SZ)
            sudo install -d -o golde -g golde -m 0700 "$BACKUP_DIR"

            # Preserve the current executable and environment before any change.
            sudo cp -a "$APP_DIR/bin/golde-marketing-api" "$BACKUP_DIR/binary.predeploy.$TS"
            sudo cp -a "$APP_DIR/.env" "$BACKUP_DIR/env.predeploy.$TS"

            # Take a consistent database dump before the new executable can run embedded migrations.
            sudo -u golde python3 - "$APP_DIR/.env" "$BACKUP_DIR/database.predeploy.$TS.dump" <<'PY'
            import os, subprocess, sys
            from urllib.parse import urlparse, unquote, parse_qs
            env_file, backup = sys.argv[1], sys.argv[2]
            values = {}
            with open(env_file, encoding="utf-8") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#") and "=" in line:
                        k, v = line.split("=", 1)
                        values[k.strip()] = v.strip().strip('"').strip("'")
            url = values.get("DATABASE_URL")
            if not url:
                raise SystemExit("DATABASE_URL missing; refusing deployment")
            parsed = urlparse(url)
            if not parsed.hostname or not parsed.path.strip("/"):
                raise SystemExit("DATABASE_URL invalid; refusing deployment")
            env = os.environ.copy()
            env["PGHOST"] = parsed.hostname
            env["PGPORT"] = str(parsed.port or 5432)
            env["PGUSER"] = unquote(parsed.username or "")
            env["PGPASSWORD"] = unquote(parsed.password or "")
            env["PGDATABASE"] = unquote(parsed.path.lstrip("/"))
            env["PGSSLMODE"] = parse_qs(parsed.query).get("sslmode", ["prefer"])[0]
            subprocess.run(["pg_dump", "--format=custom", "--file", backup], env=env, check=True)
            if not os.path.isfile(backup) or os.path.getsize(backup) == 0:
                raise SystemExit("Database backup is empty; refusing deployment")
            subprocess.run(["pg_restore", "--list", backup], stdout=subprocess.DEVNULL, check=True)
            os.chmod(backup, 0o600)
            PY
            sudo chown golde:golde "$BACKUP_DIR/database.predeploy.$TS.dump"

            # Replace wildcard CORS with the known public portal origins; retain the backup above.
            sudo python3 - "$APP_DIR/.env" <<'PY'
            import os, sys, tempfile
            path = sys.argv[1]
            lines = open(path, encoding="utf-8").read().splitlines()
            value = "https://goldetech.com,https://www.goldetech.com"
            out, found = [], False
            for line in lines:
                if line.split("=", 1)[0].strip() == "CORS_ORIGIN":
                    out.append("CORS_ORIGIN=" + value)
                    found = True
                else:
                    out.append(line)
            if not found:
                out.append("CORS_ORIGIN=" + value)
            fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path), prefix=".env.")
            try:
                with os.fdopen(fd, "w", encoding="utf-8") as f:
                    f.write("\n".join(out) + "\n")
                os.chmod(tmp, 0o600)
                os.replace(tmp, path)
            finally:
                if os.path.exists(tmp):
                    os.unlink(tmp)
            PY

            BINARY_PATH=$(find "$RELEASE_DIR" -type f -name golde-marketing-api -print -quit)
            if [ -z "$BINARY_PATH" ]; then
              echo "Release binary not found under $RELEASE_DIR" >&2
              sudo cp -a "$BACKUP_DIR/env.predeploy.$TS" "$APP_DIR/.env"
              exit 1
            fi
            sudo install -o golde -g golde -m 0755 "$BINARY_PATH" "$APP_DIR/bin/golde-marketing-api.new"
            sudo mv -f "$APP_DIR/bin/golde-marketing-api.new" "$APP_DIR/bin/golde-marketing-api"
            if ! sudo systemctl restart golde-marketing-api.service; then
              echo "Service restart failed; rolling back executable and environment."
              sudo cp -a "$BACKUP_DIR/binary.predeploy.$TS" "$APP_DIR/bin/golde-marketing-api"
              sudo cp -a "$BACKUP_DIR/env.predeploy.$TS" "$APP_DIR/.env"
              sudo chown golde:golde "$APP_DIR/bin/golde-marketing-api" "$APP_DIR/.env"
              sudo chmod 0600 "$APP_DIR/.env"
              sudo systemctl restart golde-marketing-api.service || true
              exit 1
            fi

            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:4000/health | grep -q '"status":"healthy"'; then
                HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" != true ]; then
              echo "Health check failed; rolling back executable and environment."
              sudo cp -a "$BACKUP_DIR/binary.predeploy.$TS" "$APP_DIR/bin/golde-marketing-api"
              sudo cp -a "$BACKUP_DIR/env.predeploy.$TS" "$APP_DIR/.env"
              sudo chown golde:golde "$APP_DIR/bin/golde-marketing-api" "$APP_DIR/.env"
              sudo chmod 0600 "$APP_DIR/.env"
              sudo systemctl restart golde-marketing-api.service
              curl -fsS --max-time 5 http://127.0.0.1:4000/health || true
              exit 1
            fi
            if ! curl -fsS --max-time 10 https://api.goldetech.com/health; then
              echo "External health check failed; rolling back executable and environment."
              sudo cp -a "$BACKUP_DIR/binary.predeploy.$TS" "$APP_DIR/bin/golde-marketing-api"
              sudo cp -a "$BACKUP_DIR/env.predeploy.$TS" "$APP_DIR/.env"
              sudo chown golde:golde "$APP_DIR/bin/golde-marketing-api" "$APP_DIR/.env"
              sudo chmod 0600 "$APP_DIR/.env"
              sudo systemctl restart golde-marketing-api.service
              exit 1
            fi
            echo "Deployment healthy. Binary, env, and database backups retained under $BACKUP_DIR."
