
name: Deploy to AWS EC2 Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm production deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: golde-marketing-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_production == true
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: golde
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketing_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golde -d marketing_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://golde:password@localhost:5432/marketing_api?sslmode=disable
      JWT_ACCESS_SECRET: deployment_build_access_secret_at_least_32_chars
      JWT_REFRESH_SECRET: deployment_build_refresh_secret_at_least_32_chars

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Prepare CI database schema
        run: sqlx migrate run --source ./migrations

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features -- --nocapture

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu --bin golde-marketing-api

      - name: Validate release binary
        shell: bash
        run: |
          set -euo pipefail
          BINARY="target/x86_64-unknown-linux-gnu/release/golde-marketing-api"
          test -s "$BINARY"
          file "$BINARY"
          readelf -h "$BINARY" | grep -E 'Class:.*ELF64'
          readelf -h "$BINARY" | grep -E 'Machine:.*X86-64'

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          BINARY="target/x86_64-unknown-linux-gnu/release/golde-marketing-api"
          tar -czf /tmp/golde-marketing-api-release.tar.gz \
            -C "$(dirname "$BINARY")" golde-marketing-api
          tar -tzf /tmp/golde-marketing-api-release.tar.gz

      - name: Verify GitHub OIDC subject
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?OIDC URL unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?OIDC token unavailable}"

          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL")"
          JWT="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"

          python - "$JWT" <<'PY'
          import base64
          import json
          import sys

          parts = sys.argv[1].split(".")
          if len(parts) != 3:
              raise SystemExit("Invalid JWT format")
          payload = parts[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "environment", "ref", "job_workflow_ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::352285845269:role/golde-growthos-portal-deploy
          aws-region: ap-south-1

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Upload release to private S3
        env:
          RELEASE_BUCKET: golde-growthos-portal-deploy-352285845269-ap-south-1
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp \
            /tmp/golde-marketing-api-release.tar.gz \
            "s3://${RELEASE_BUCKET}/releases/backend-${GITHUB_SHA}.tar.gz" \
            --sse AES256

      - name: Deploy through AWS Systems Manager
        env:
          RELEASE_BUCKET: golde-growthos-portal-deploy-352285845269-ap-south-1
          INSTANCE_ID: i-02f31c0724d24bac8
          AWS_REGION: ap-south-1
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/activate-backend.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          REGION="ap-south-1"
          BUCKET="golde-growthos-portal-deploy-352285845269-ap-south-1"
          INSTANCE_ID="i-02f31c0724d24bac8"
          SHA="__GITHUB_SHA__"
          APP_DIR="/opt/golde-marketing-api"
          BINARY="${APP_DIR}/bin/golde-marketing-api"
          BACKUP_DIR="${APP_DIR}/backups"
          STAGE="/tmp/golde-api-${SHA}"
          ARCHIVE="/tmp/golde-api-${SHA}.tar.gz"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SERVICE="golde-marketing-api.service"
          CHANGED=0
          ROLLBACK_RUNNING=0

          log() { echo "[$(date -u +%FT%TZ)] $*"; }

          health_local() {
            local body
            body="$(curl -fsS --max-time 5 http://127.0.0.1:4000/health)" || return 1
            printf '%s' "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'
          }

          health_public() {
            local body
            body="$(curl -fsS --max-time 15 https://api.goldetech.com/health)" || return 1
            printf '%s' "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'
          }

          wait_local_health() {
            for attempt in $(seq 1 15); do
              if health_local; then return 0; fi
              sleep 2
            done
            return 1
          }

          rollback() {
            local restore="${APP_DIR}/bin/golde-marketing-api.rollback"
            log "Starting rollback."

            systemctl stop "$SERVICE" || true

            if ! install -o golde -g golde -m 0755 \
                "${BACKUP_DIR}/binary.predeploy.${TS}" "$restore"; then
              log "CRITICAL: unable to stage previous executable."
              return 1
            fi

            if ! mv -f "$restore" "$BINARY"; then
              log "CRITICAL: unable to restore previous executable."
              return 1
            fi

            if ! install -o golde -g golde -m 0600 \
                "${BACKUP_DIR}/env.predeploy.${TS}" "${APP_DIR}/.env"; then
              log "CRITICAL: unable to restore previous environment."
              return 1
            fi

            if ! systemctl start "$SERVICE"; then
              log "CRITICAL: previous service failed to start."
              return 1
            fi

            if wait_local_health; then
              log "Previous release is locally healthy."
              return 0
            fi

            journalctl -u "$SERVICE" -n 80 --no-pager || true
            log "CRITICAL: rollback attempted but health did not recover."
            return 1
          }

          on_error() {
            local rc=$?
            trap - ERR
            if [ "$CHANGED" -eq 1 ] && [ "$ROLLBACK_RUNNING" -eq 0 ]; then
              ROLLBACK_RUNNING=1
              if ! rollback; then
                log "CRITICAL: automatic rollback failed; manual recovery required."
              fi
            fi
            exit "$rc"
          }
          trap on_error ERR

          log "Preparing release ${SHA}"

          if [ "$(id -u)" -ne 0 ]; then
            echo "Deployment script must run as root." >&2
            exit 1
          fi

          command -v aws >/dev/null 2>&1
          command -v curl >/dev/null 2>&1
          command -v python3 >/dev/null 2>&1
          command -v file >/dev/null 2>&1
          command -v readelf >/dev/null 2>&1
          command -v pg_dump >/dev/null 2>&1
          command -v pg_restore >/dev/null 2>&1

          test "$(uname -m)" = "x86_64"
          test -x "$BINARY"
          test -s "${APP_DIR}/.env"
          id golde >/dev/null 2>&1
          systemctl is-active --quiet "$SERVICE"

          aws s3 cp \
            "s3://${BUCKET}/releases/backend-${SHA}.tar.gz" \
            "$ARCHIVE" --region "$REGION"

          tar -tzf "$ARCHIVE" | grep -qx 'golde-marketing-api'
          install -d -m 0700 "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          test -s "${STAGE}/golde-marketing-api"
          file "${STAGE}/golde-marketing-api"
          readelf -h "${STAGE}/golde-marketing-api" | grep -E 'Class:.*ELF64'
          readelf -h "${STAGE}/golde-marketing-api" | grep -E 'Machine:.*X86-64'

          install -d -o golde -g golde -m 0700 "$BACKUP_DIR"
          cp -a "$BINARY" "${BACKUP_DIR}/binary.predeploy.${TS}"
          cp -a "${APP_DIR}/.env" "${BACKUP_DIR}/env.predeploy.${TS}"

          # Back up production DB before replacing the executable.
          python3 - "${APP_DIR}/.env" "${BACKUP_DIR}/database.predeploy.${TS}.dump" <<'PY'
          import os
          import subprocess
          import sys
          from urllib.parse import urlparse, unquote, parse_qs

          env_file, backup = sys.argv[1], sys.argv[2]
          values = {}
          with open(env_file, encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith("#") and "=" in line:
                      key, value = line.split("=", 1)
                      values[key.strip()] = value.strip().strip('"').strip("'")

          url = values.get("DATABASE_URL")
          if not url:
              raise SystemExit("DATABASE_URL missing; deployment aborted.")

          parsed = urlparse(url)
          if not parsed.hostname or not parsed.path.strip("/"):
              raise SystemExit("DATABASE_URL invalid; deployment aborted.")

          env = os.environ.copy()
          env["PGHOST"] = parsed.hostname
          env["PGPORT"] = str(parsed.port or 5432)
          env["PGUSER"] = unquote(parsed.username or "")
          env["PGPASSWORD"] = unquote(parsed.password or "")
          env["PGDATABASE"] = unquote(parsed.path.lstrip("/"))
          env["PGSSLMODE"] = parse_qs(parsed.query).get("sslmode", ["prefer"])[0]

          subprocess.run(["pg_dump", "--format=custom", "--file", backup],
                         env=env, check=True)
          if not os.path.isfile(backup) or os.path.getsize(backup) == 0:
              raise SystemExit("Database backup empty; deployment aborted.")
          subprocess.run(["pg_restore", "--list", backup],
                         stdout=subprocess.DEVNULL, check=True)
          os.chmod(backup, 0o600)
          PY

          chown golde:golde "${BACKUP_DIR}/database.predeploy.${TS}.dump"
          chmod 0600 "${BACKUP_DIR}/database.predeploy.${TS}.dump"

          # Stage on the same filesystem as the live executable.
          install -o golde -g golde -m 0755 \
            "${STAGE}/golde-marketing-api" "${APP_DIR}/bin/golde-marketing-api.new"

          # Set CHANGED before the first production mutation so the error trap
          # attempts recovery if any following command fails.
          CHANGED=1
          systemctl stop "$SERVICE"
          mv -f "${APP_DIR}/bin/golde-marketing-api.new" "$BINARY"
          systemctl start "$SERVICE"

          if ! wait_local_health; then
            journalctl -u "$SERVICE" -n 80 --no-pager || true
            echo "Local health check failed." >&2
            false
          fi

          if ! health_public; then
            echo "Public HTTPS health check failed." >&2
            false
          fi

          # Disarm automatic rollback only after both health checks pass.
          CHANGED=0
          trap - ERR

          log "GOLDE_MARKETING_API_DEPLOY_OK"
          log "Release: ${SHA}"
          log "Backup directory: ${BACKUP_DIR}"
          log "Database backup: database.predeploy.${TS}.dump"
          REMOTE_SCRIPT

          sed -i "s/__GITHUB_SHA__/${GITHUB_SHA}/g" /tmp/activate-backend.sh

          jq -n \
            --arg script "$(cat /tmp/activate-backend.sh)" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: ["i-02f31c0724d24bac8"],
              Comment: "Deploy GOLD-e GrowthOS Rust API",
              Parameters: {commands: [$script]}
            }' > /tmp/ssm-command.json

          COMMAND_ID="$(
            aws ssm send-command \
              --cli-input-json file:///tmp/ssm-command.json \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command: ${COMMAND_ID}"

          for attempt in $(seq 1 60); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command ${COMMAND_ID}" >&2
          exit 1
