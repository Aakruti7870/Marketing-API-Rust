name: Deploy to AWS EC2 Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build Binary & Deploy to EC2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: golde
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketing_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://golde:password@localhost:5432/marketing_api?sslmode=disable
      JWT_ACCESS_SECRET: deployment_build_access_secret_at_least_32_chars
      JWT_REFRESH_SECRET: deployment_build_refresh_secret_at_least_32_chars

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run Database Migrations for SQLx Compile-Time Schema
        run: sqlx migrate run --source ./migrations

      - name: Build Optimized Release Binary
        run: cargo build --release --bin golde-marketing-api

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo " Stopping running systemd service..."
            sudo systemctl stop golde-marketing-api || true

            echo "📦 Backing up old binary..."
            sudo cp /opt/golde-marketing-api/bin/golde-marketing-api /opt/golde-marketing-api/bin/golde-marketing-api.bak || true

      - name: Transfer Binary & Migrations via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "target/release/golde-marketing-api,migrations"
          target: "/opt/golde-marketing-api/"

      - name: Restart Service and Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /opt/golde-marketing-api/target/release/golde-marketing-api /opt/golde-marketing-api/bin/golde-marketing-api
            sudo chmod +x /opt/golde-marketing-api/bin/golde-marketing-api
            sudo systemctl restart golde-marketing-api
            sleep 3
            curl -f http://localhost:4000/health || (echo "Health check failed!" && exit 1)
            echo "🚀 Deployment succeeded!"
