name: Deploy to AWS EC2 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: golde
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketing_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golde -d marketing_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://golde:password@localhost:5432/marketing_api?sslmode=disable
      JWT_ACCESS_SECRET: deployment_build_access_secret_at_least_32_chars
      JWT_REFRESH_SECRET: deployment_build_refresh_secret_at_least_32_chars

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Prepare database schema
        run: sqlx migrate run --source ./migrations

      - name: Build
        run: cargo build --release --bin golde-marketing-api

      - name: Prepare release staging directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            rm -rf /tmp/golde-marketing-api-release
            mkdir -p /tmp/golde-marketing-api-release

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "target/release/golde-marketing-api,migrations"
          target: "/tmp/golde-marketing-api-release/"

      - name: Activate release and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=/opt/golde-marketing-api
            RELEASE_DIR=/tmp/golde-marketing-api-release

            sudo systemctl stop golde-marketing-api.service 2>/dev/null || true
            BINARY_PATH=$(find "$RELEASE_DIR" -type f -name golde-marketing-api -print -quit)
            if [ -z "$BINARY_PATH" ]; then
              echo "Release binary not found under $RELEASE_DIR" >&2
              exit 1
            fi
            sudo cp "$BINARY_PATH" "$APP_DIR/bin/golde-marketing-api"
            sudo chmod 755 "$APP_DIR/bin/golde-marketing-api"
            sudo chown golde:golde "$APP_DIR/bin/golde-marketing-api"
            find "$RELEASE_DIR" -type f -name '*.sql' -exec sudo cp {} "$APP_DIR/migrations/" \; 2>/dev/null || true
            sudo chown -R golde:golde "$APP_DIR/migrations" 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl restart golde-marketing-api
            sleep 3
            curl -fsS http://127.0.0.1:4000/health
            curl -fsS https://api.goldetech.com/health
